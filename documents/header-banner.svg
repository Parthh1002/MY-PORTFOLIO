<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e" />
      <stop offset="45%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <radialGradient id="indigoGlow" cx="20%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="85%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0e7ff" />
      <stop offset="70%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>

    <!-- Badge Shield Gradients -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="logoLetterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.18" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#818cf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .banner-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', Roboto, 'Inter', sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: 2px;
      fill: url(#textGrad);
    }
    .banner-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Fira Code', 'JetBrains Mono', Roboto, monospace;
      font-weight: 500;
      font-size: 17px;
      letter-spacing: 3px;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #cbd5e1;
      letter-spacing: 0.5px;
    }
    .logo-letter {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 44px;
      letter-spacing: -2px;
      fill: url(#logoLetterGrad);
    }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glow Overlays -->
  <rect width="1200" height="340" rx="16" fill="url(#indigoGlow)" />
  <rect width="1200" height="340" rx="16" fill="url(#cyanGlow)" />
  <rect width="1200" height="340" rx="16" fill="url(#purpleGlow)" />

  <!-- Technical Grid Background -->
  <rect width="1200" height="340" rx="16" fill="url(#gridPattern)" />

  <!-- Decorative Wave Lines in Background -->
  <path d="M 0 280 C 300 240, 450 320, 750 270 C 950 235, 1100 290, 1200 270" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.22" />
  <path d="M 0 295 C 280 255, 520 330, 800 285 C 1000 250, 1120 305, 1200 285" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.18" />

  <!-- Top Border Accent Line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#borderGrad)" />
  <!-- Bottom Border Accent Line -->
  <rect x="0" y="338" width="1200" height="2" fill="url(#borderGrad)" />

  <!-- ════════════════════════════════════════════════════════════════════════ -->
  <!-- LEFT: ORIGINAL BRANDING BADGE (PP MONOGRAM)                           -->
  <!-- ════════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(100, 70)" filter="url(#badgeShadow)">
    <!-- Outer Glow Ring -->
    <rect x="-6" y="-6" width="132" height="132" rx="30" fill="none" stroke="url(#logoLetterGrad)" stroke-width="2" stroke-opacity="0.5" />
    
    <!-- Shield Container -->
    <rect x="0" y="0" width="120" height="120" rx="24" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Inner Accent Frame -->
    <rect x="8" y="8" width="104" height="104" rx="18" fill="none" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="6,4" />

    <!-- PP Monogram Text -->
    <text x="60" y="75" text-anchor="middle" class="logo-letter">PP</text>

    <!-- Mini Status Dot -->
    <circle cx="98" cy="22" r="4.5" fill="#10b981" />
    <circle cx="98" cy="22" r="8" fill="#10b981" fill-opacity="0.3" />
  </g>

  <!-- ════════════════════════════════════════════════════════════════════════ -->
  <!-- CENTER / RIGHT: TITLE, SUBTITLE & INTERACTIVE TAGS                      -->
  <!-- ════════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(265, 105)">
    <!-- Name / Title -->
    <text x="0" y="38" class="banner-title" filter="url(#textGlow)">PARTH PATEL</text>

    <!-- Subtitle / Role -->
    <g transform="translate(0, 70)">
      <circle cx="5" cy="-5" r="3.5" fill="#38bdf8" />
      <text x="18" y="0" class="banner-sub">CREATIVE DEVELOPER &amp; AI / ML ENGINEER</text>
    </g>

    <!-- Interactive Pill Badges -->
    <g transform="translate(0, 96)">
      <!-- Pill 1: Full-Stack -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="170" height="32" rx="16" fill="#1e1b4b" fill-opacity="0.75" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4" />
        <circle cx="16" cy="16" r="4" fill="#6366f1" />
        <text x="30" y="20" class="tag-text">Full-Stack Web Apps</text>
      </g>

      <!-- Pill 2: AI / Computer Vision -->
      <g transform="translate(182, 0)">
        <rect x="0" y="0" width="186" height="32" rx="16" fill="#082f49" fill-opacity="0.75" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4" />
        <circle cx="16" cy="16" r="4" fill="#38bdf8" />
        <text x="30" y="20" class="tag-text">AI &amp; Computer Vision</text>
      </g>

      <!-- Pill 3: 60-120 FPS UI/UX -->
      <g transform="translate(380, 0)">
        <rect x="0" y="0" width="185" height="32" rx="16" fill="#141a29" fill-opacity="0.85" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
        <circle cx="16" cy="16" r="4" fill="#a855f7" />
        <text x="30" y="20" class="tag-text">Butter-Smooth UI/UX</text>
      </g>

      <!-- Pill 4: B.Tech CSE -->
      <g transform="translate(577, 0)">
        <rect x="0" y="0" width="150" height="32" rx="16" fill="#064e3b" fill-opacity="0.65" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
        <circle cx="16" cy="16" r="4" fill="#10b981" />
        <text x="30" y="20" class="tag-text">B.Tech CSE '26</text>
      </g>
    </g>
  </g>

  <!-- Ambient Sparkles in Top Right -->
  <g transform="translate(1080, 50)" fill="#38bdf8" fill-opacity="0.7">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" />
  </g>
  <g transform="translate(1130, 95)" fill="#818cf8" fill-opacity="0.5">
    <path d="M 0 -5 L 1.5 -1.5 L 5 0 L 1.5 1.5 L 0 5 L -1.5 1.5 L -5 0 L -1.5 -1.5 Z" />
  </g>
  <g transform="translate(1040, 110)" fill="#a855f7" fill-opacity="0.6">
    <path d="M 0 -6 L 1.8 -1.8 L 6 0 L 1.8 1.8 L 0 6 L -1.8 1.8 L -6 0 L -1.8 -1.8 Z" />
  </g>
</svg>
